name: Crear y publicar Reel TCT
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar el video en las redes configuradas
        type: boolean
        default: false
  schedule:
    - cron: '0 15 * * *'  # 09:00 CDMX
    - cron: '0 20 * * *'  # 14:00 CDMX
    - cron: '0 1 * * *'   # 19:00 CDMX
concurrency:
  group: tct-video-publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLISH_PLATFORMS: ${{ vars.PUBLISH_PLATFORMS }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v21.0' }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video_tct/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-scraper.txt
      - name: Caché de pesos locales Chatterbox Multilingual TTS (~2.1 GB)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            toon_host/01/voice_cache/chatterbox_goku
          key: chatterbox-goku-v1-${{ hashFiles('toon_host/01/clone_voice_tct.py') }}
          restore-keys: |
            chatterbox-goku-v1-
      - name: Instalar herramientas y Chatterbox TTS Local
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip curl
          pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps chatterbox-tts
          pip install edge-tts opencv-python-headless numpy pillow playwright librosa s3tokenizer resemble-perth conformer==0.3.2 safetensors pyloudnorm omegaconf pykakasi==2.3.0 diffusers==0.29.0 transformers huggingface-hub
          playwright install --with-deps chromium
          curl -fsSL https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip -o /tmp/rhubarb.zip
          sudo unzip -q /tmp/rhubarb.zip -d /opt/rhubarb
          sudo ln -sf /opt/rhubarb/Rhubarb-Lip-Sync-1.13.0-Linux/rhubarb /usr/local/bin/rhubarb
          # Scrapling modo ligero (último recurso de extracción, sin navegadores)
          pip install -r requirements-scraper.txt
          npm ci
          npm ci --prefix video_tct
      - name: Pruebas sin servicios externos
        run: npm test --prefix video_tct
      - name: Validar configuración de publicación
        if: github.event_name == 'schedule' || inputs.publish
        run: node video_tct/publish_video.js --check-config
      - name: Generar guion, gráficos y narración
        env:
          VIDEO_VISUAL_MODE: ${{ vars.VIDEO_VISUAL_MODE || 'hybrid' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'TX3LPaxmHKxFdv7VOQHJ' }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_v4_turbo' }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }} # Opcional: más cuota en Jina Reader
        run: npm run generate --prefix video_tct
      - name: Validar composición y renderizar con Toon Maker (Personaje 01)
        working-directory: video_tct
        run: |
          mkdir -p out
          python render_toon_tct.py --output out/render.mp4
          ffmpeg -y -i out/render.mp4 -c:v libx264 -pix_fmt yuv420p -r 30 -c:a aac -b:a 128k -ar 48000 -movflags +faststart out/video_final_tct.mp4
          node scripts/seal-render.js
      - name: Publicar en Facebook e Instagram
        if: github.event_name == 'schedule' || inputs.publish
        run: npm run publish --prefix video_tct
      - name: Guardar video, fuentes y estado incluso si una red falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tct-video-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            video_tct/out/
            video_tct/src/news_data.json
            video_tct/publication-state.json
            video_tct/used_video_news.json
            published_news.json
            video_tct/public/voice_scene_*.mp3
      - name: Persistir resultados por red
        if: always() && (github.event_name == 'schedule' || inputs.publish)
        run: |
          if [ -f video_tct/publication-state.json ]; then
            bash .github/scripts/persist_state.sh "chore: persist video publication state [skip ci]" \
              video_tct/publication-state.json video_tct/used_video_news.json published_news.json
          fi
