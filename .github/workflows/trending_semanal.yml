name: Top 10 Trending IA Semanal

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 5'  # Viernes 10:00 AM (UTC-6) / 11:00 AM (UTC-5)

jobs:
  trending-top10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Trending Top 10 (Hugging Face & GitHub)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node trending_top10.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trending-top10-${{ github.run_number }}
          path: trending_top10.json
          retention-days: 7
