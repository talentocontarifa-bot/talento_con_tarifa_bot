name: Crear Video Editorial (Talento con Tarifa)

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      title:
        description: 'Título del video / ensayo'
        required: false
        default: ''
      script:
        description: 'Guion narrativo completo (1 a 1.5 minutos)'
        required: false
        default: ''
      issue_number:
        description: 'Número de issue a procesar (opcional)'
        required: false

concurrency:
  group: tct-video-publication
  cancel-in-progress: false

jobs:
  render-and-publish:
    # Solo ejecutar si es workflow_dispatch O si el issue tiene la etiqueta 'editorial', 'video' o el título/cuerpo coincide
    if: >
      github.event_name == 'workflow_dispatch' || (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) && (
      contains(github.event.issue.labels.*.name, 'editorial') ||
      contains(github.event.issue.labels.*.name, 'video') ||
      contains(github.event.issue.title, '[EDITORIAL]') ||
      contains(github.event.issue.body, 'GUION:')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install edge-tts requests google-generativeai python-dotenv

      - name: Install Node.js dependencies
        run: |
          npm ci
          cd video_editorial
          npm ci

      - name: Generate Editorial Video Composition
        env:
          VIDEO_VISUAL_MODE: ${{ vars.VIDEO_VISUAL_MODE || 'hybrid' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITORIAL_TITLE: ${{ inputs.title }}
          EDITORIAL_SCRIPT: ${{ inputs.script }}
          EDITORIAL_ISSUE: ${{ inputs.issue_number || github.event.issue.number }}
        run: |
          cd video_editorial
          python generate_editorial_video.py

      - name: Render Video with Hyperframes
        run: |
          cd video_editorial
          npx hyperframes check
          mkdir -p out
          npx hyperframes render -o out/render.mp4
          ffmpeg -y -i out/render.mp4 -c:v libx264 -pix_fmt yuv420p -r 30 -c:a aac -b:a 128k -ar 48000 -movflags +faststart out/video_editorial.mp4
          node ../video_tct/scripts/seal-render.js --editorial

      - name: Publish to Facebook, Instagram, TikTok & YouTube
        env:
          PUBLISH_PLATFORMS: ${{ vars.PUBLISH_PLATFORMS }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v21.0' }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd video_editorial
          node publish_editorial.js

      - name: Upload Video Artifact (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-editorial-${{ github.run_number }}
          path: |
            video_editorial/out/
            video_editorial/publication-state.json
            video_editorial/published-editorials.json
            video_editorial/editorial_data.json
          retention-days: 7
      - name: Persist editorial delivery state
        if: always()
        run: |
          if [ -f video_editorial/publication-state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add video_editorial/publication-state.json
            if [ -f video_editorial/published-editorials.json ]; then git add video_editorial/published-editorials.json; fi
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist editorial publication state [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
