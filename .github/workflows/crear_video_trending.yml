name: Crear Video Reel Top 10 Trending (Lunes y Viernes)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar el video en las redes configuradas (Facebook, Instagram, TikTok, YouTube)'
        type: boolean
        default: false
  schedule:
    - cron: '0 15 * * 1,5'  # Lunes y Viernes a las 09:00 CDMX (15:00 UTC)

concurrency:
  group: tct-video-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  video-trending:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLISH_PLATFORMS: ${{ vars.PUBLISH_PLATFORMS }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v21.0' }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'TX3LPaxmHKxFdv7VOQHJ' }}
      ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_v4_turbo' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VIDEO_VISUAL_MODE: ${{ vars.VIDEO_VISUAL_MODE || 'hybrid' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video_tct/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts
          npm ci
          npm ci --prefix video_tct

      - name: Ejecutar pruebas unitarias
        run: npm test --prefix video_tct

      - name: 1. Obtener Top 10 (Hugging Face & GitHub)
        run: node trending_top10.js

      - name: Validar configuración de publicación
        if: github.event_name == 'schedule' || inputs.publish
        run: node video_tct/publish_video.js --check-config

      - name: 2. Generar guion de video, audio e imágenes para Top 10
        run: npm run generate:trending --prefix video_tct

      - name: 3. Validar composición y renderizar Video Reel
        working-directory: video_tct
        run: |
          npx hyperframes check
          mkdir -p out
          npx hyperframes render -o out/render.mp4
          ffmpeg -y -i out/render.mp4 -c:v libx264 -pix_fmt yuv420p -r 30 -c:a aac -b:a 128k -ar 48000 -movflags +faststart out/video_final_tct.mp4
          node scripts/seal-render.js

      - name: 4. Publicar Reel en Redes (Instagram, Facebook, TikTok, YouTube)
        if: github.event_name == 'schedule' || inputs.publish
        run: npm run publish --prefix video_tct

      - name: Guardar artefactos (Video y Estado)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trending-video-${{ github.run_number }}
          retention-days: 7
          path: |
            trending_top10.json
            video_tct/out/
            video_tct/src/news_data.json
            video_tct/publication-state.json
            video_tct/public/voice_scene_*.mp3
            video_tct/public/scene_*.png

      - name: Persistir estado de entrega
        if: always() && (github.event_name == 'schedule' || inputs.publish)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f video_tct/publication-state.json ]; then
            git add video_tct/publication-state.json trending_top10.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist trending top 10 video publication state [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
