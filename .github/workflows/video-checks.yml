name: Validar videos TCT
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test video_tct/tests/*.test.js
      - run: node --check video_tct/create_daily_news.js
      - run: node --check video_tct/publish_video.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s video_editorial/tests -v
